// Prescription dates are fictional demo data, independent of treatment duration.
function prescriptionFlag(m, now = new Date()) {
  if (!m.ongoing || !/^\d{4}-\d{2}-\d{2}$/.test(m.prescriptionEnd || '')) return '';
  const end = Date.parse(m.prescriptionEnd + 'T00:00:00Z');
  if (!Number.isFinite(end) || new Date(end).toISOString().slice(0, 10) !== m.prescriptionEnd) return '';
  const parts = new Intl.DateTimeFormat('en-GB', {timeZone:'Europe/Ljubljana', year:'numeric', month:'2-digit', day:'2-digit'}).formatToParts(now);
  const part = name => parts.find(p => p.type === name).value;
  const today = Date.parse(`${part('year')}-${part('month')}-${part('day')}T00:00:00Z`);
  const days = Math.round((end - today) / 86400000);
  if (days > 7) return '';
  const label = days < 0 ? 'Prescription overdue for review' : days === 0 ? 'Prescription runs out today' : `Prescription runs out in ${days} day${days === 1 ? '' : 's'}`;
  return `<div class="medicine-tags"><span class="pill ${days <= 0 ? 'red' : 'amber'}">${icon('alert')} ${label}</span></div>`;
}

function prescriptionInfo(m) {
  if (state.role !== 'doctor') return '';
  const date = m.prescriptionEnd ? new Date(m.prescriptionEnd + 'T12:00:00Z').toLocaleDateString('en-GB', {timeZone:'Europe/Ljubljana', day:'numeric', month:'short', year:'numeric'}) : 'Not recorded';
  return `${prescriptionFlag(m)}<p class="small muted">Prescription run-out date: ${date}</p>`;
}

// Anatomical left/right refer to the patient, not the viewer.
const bodyRegions = [
 ['Head','M90 35 a30 30 0 1 0 60 0 a30 30 0 1 0 -60 0'],
 ['Neck','M106 66 H134 V90 H106 Z'],
 ['Chest','M85 92 Q120 82 155 92 L150 158 H90 Z','Upper back'],
 ['Abdomen','M90 162 H150 L155 214 H85 Z','Lower back'],
 ['Pelvis','M85 218 H155 L158 251 L120 265 L82 251 Z','Buttocks'],
 ['Right arm','M80 94 L85 153 L65 217 L45 210 L58 135 Q63 104 80 94'],
 ['Left arm','M160 94 L155 153 L175 217 L195 210 L182 135 Q177 104 160 94'],
 ['Right hand','M44 214 L64 221 L57 253 Q40 269 34 249 Z'],
 ['Left hand','M196 214 L176 221 L183 253 Q200 269 206 249 Z'],
 ['Right leg','M83 257 L117 270 L113 352 L105 425 H81 L78 350 Z'],
 ['Left leg','M157 257 L123 270 L127 352 L135 425 H159 L162 350 Z'],
 ['Right foot','M81 429 H105 L106 450 Q87 462 68 453 Z'],
 ['Left foot','M135 429 H159 L172 453 Q153 462 134 450 Z']
];
function painMap(selected=[]){return `<p class="question-hint">Click or tap where it hurts. Select more than one area if needed; select again to remove. Left and right refer to your body.</p><div class="body-maps">${['Front','Back'].map(view=>`<figure><figcaption>${view}</figcaption><svg viewBox="20 0 200 470" role="group" aria-label="${view} of body: select pain locations">${bodyRegions.map(([name,path,back])=>{const label=view==='Back'?(back||name.replace('Right','TEMP').replace('Left','Right').replace('TEMP','Left')):name;const value=`${label} (${view.toLowerCase()})`;return `<path d="${path}" class="body-region ${selected.includes(value)?'selected':''}" role="button" tabindex="0" aria-label="${value}" aria-pressed="${selected.includes(value)}" data-pain-location="${value}"><title>${value}</title></path>`;}).join('')}</svg></figure>`).join('')}</div><p class="pain-selection" aria-live="polite"><strong>Selected:</strong> ${selected.length?e(selected.join('; ')):'No areas selected yet'}</p>`; }
function wizardSymptomSummary(answers){return `<div class="answer-row"><span>Pain locations</span><strong>${e((answers.locations||[]).join('; ')||'No locations selected')}</strong></div>${answers.main==='Other'&&answers.other?.trim()?`<div class="answer-row"><span>Other symptoms</span><strong>${e(answers.other)}</strong></div>`:''}`;}
document.addEventListener('input',event=>{if(event.target.id==='other-symptom')state.questionState.answers.other=event.target.value;});
document.addEventListener('click',event=>{const target=event.target.closest('[data-pain-location]');if(!target)return;const value=target.dataset.painLocation;const selected=state.questionState.answers.locations||[];state.questionState.answers.locations=selected.includes(value)?selected.filter(v=>v!==value):[...selected,value];const scroll=document.querySelector('.modal-body').scrollTop;renderWizardStep();document.querySelector('.modal-body').scrollTop=scroll;[...document.querySelectorAll('[data-pain-location]')].find(el=>el.dataset.painLocation===value)?.focus({preventScroll:true});});
document.addEventListener('keydown',event=>{if(event.target.matches('[data-pain-location]')&&['Enter',' '].includes(event.key)){event.preventDefault();event.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});

function renderWizardStep() {
  const step = state.questionState.step;
  let content = '';
  if(step === 1) {
    content = `
      <h2 class="question-title">What is your primary health concern today?</h2>
      <p class="question-hint">Select the option that best matches your symptoms.</p>
      <div class="choice-grid">
        ${['Shortness of breath / Cough', 'Persistent headache or dizziness', 'Joint or back pain', 'General fatigue / Fever', 'Other'].map(opt => `
          <button class="choice ${state.questionState.answers.main===opt?'selected':''}" onclick="setWizardAnswer('main', '${opt}')">
            <div class="choice-box">${icon('check')}</div>
            <div><strong>${opt}</strong></div>
          </button>
        `).join('')}
      </div>
    `;
    content += `${state.questionState.answers.main==='Other'?`<div class="other-symptom"><label for="other-symptom">Describe your symptoms (optional)</label><textarea id="other-symptom" rows="3" maxlength="1000">${e(state.questionState.answers.other)}</textarea></div>`:''}`;
  } else if(step === 2) {
    content = `<h2 class="question-title">Where does it hurt?</h2>${painMap(state.questionState.answers.locations)}<p class="question-hint">If you have no pain, continue without selecting an area.</p>`;
  } else if(step === 3) {
    content = `
      <h2 class="question-title">How long have you experienced these symptoms?</h2>
      <p class="question-hint">Knowing the duration helps your doctor prioritize care.</p>
      <div class="choice-grid">
        ${['Less than 24 hours', '1 to 3 days', '3 to 5 days', 'More than a week'].map(opt => `
          <button class="choice ${state.questionState.answers.duration===opt?'selected':''}" onclick="setWizardAnswer('duration', '${opt}')">
            <div class="choice-box">${icon('check')}</div>
            <div><strong>${opt}</strong></div>
          </button>
        `).join('')}
      </div>
    `;
  } else if(step === 4) {
    content = `
      <h2 class="question-title">Review & Submit Questionnaire</h2>
      <p class="question-hint">Your answers will be securely attached to your file so your doctor will review them before your consultation.</p>
      
      <div class="answer-list">
        ${wizardSymptomSummary(state.questionState.answers)}
        <div class="answer-row">
          <span>Primary Concern</span>
          <strong>${state.questionState.answers.main}</strong>
        </div>
        <div class="answer-row">
          <span>Duration</span>
          <strong>${state.questionState.answers.duration}</strong>
        </div>
      </div>

      <div class="notice" style="margin-top:20px;">
        ${icon('shield')}
        <div>
          <strong>Privacy Note:</strong> Your responses are encrypted and directly linked to your electronic health record.
        </div>
      </div>
    `;
  } else {
    content = `
      <div class="success">
        <div class="success-mark">${icon('check')}</div>
        <h3>Questionnaire Submitted Successfully</h3>
        <p>Your doctor will review your responses prior to your appointment.</p>
        <div class="notice">
          ${icon('clock')}
          <div>
            <strong>Next Step:</strong> You can view this summary in your Requests & Test Status tab.
          </div>
        </div>
      </div>
    `;
  }

  openModal(`
    <div class="modal-header">
      <div>
        <h2>Guided Consultation Assistant</h2>
        <p>Step ${Math.min(step, 4)} of 4</p>
      </div>
      <button class="close" onclick="closeModal()">${icon('x')}</button>
    </div>
    <div class="modal-body">
      <div class="progress">
        <span class="${step>=1?'done':''}"></span>
        <span class="${step>=2?'done':''}"></span>
        <span class="${step>=3?'done':''}"></span>
        <span class="${step>=4?'done':''}"></span>
      </div>
      ${content}
    </div>
    <div class="modal-footer">
      ${step > 1 && step < 5 ? `<button class="btn" onclick="prevWizardStep()">Back</button>` : `<div></div>`}
      ${step < 4 ? `<button class="btn primary" onclick="nextWizardStep()">Continue</button>` : (step === 4 ? `<button class="btn primary" onclick="submitWizard()">Submit to Doctor</button>` : `<button class="btn primary" onclick="closeModal()">Done</button>`)}
    </div>
  `);
}

function pendingRenewal(patientId, index) {
  return state.requests.some(r=>r.type==='Medication renewal'&&r.patientId===patientId&&r.status==='pending'&&r.medicationIndexes.includes(index));
}

}

function renderRenewalModal() {
  const request=state.renewalRequest, patient=state.patients[request.patientId];
  openModal(`<div class="modal-header"><div><h2>Request Medication Renewal</h2><p>${e(patient.name)} · Select the medications you would like renewed.</p></div><button class="close" aria-label="Close renewal request" onclick="closeModal()">${icon('x')}</button></div>
    <div class="modal-body"><p class="question-hint">Choose one or more existing medications. Your doctor will review the request.</p><div class="choice-grid">
    ${patient.medications.map((med,index)=>{const pending=pendingRenewal(patient.id,index), selected=request.medications.includes(index);return `<button class="choice ${selected?'selected':''}" aria-pressed="${selected}" onclick="toggleRenewalMedication(${index})" ${pending?'disabled':''}><span class="choice-box">${selected?icon('check'):''}</span><span><strong>${e(med.name)}</strong><small>${e(med.dose)}${pending?' · Renewal already pending':''}</small></span></button>`;}).join('')||'<p>No medications are listed in this patient’s Passport.</p>'}
    </div><div class="other-symptom"><label for="renewal-notes">Additional notes (optional)</label><textarea id="renewal-notes" rows="3" maxlength="1000">${e(request.notes)}</textarea></div></div>

function toggleRenewalMedication(index) {
  const r=state.renewalRequest;
  if(!r||!state.patients[r.patientId].medications[index]||pendingRenewal(r.patientId,index))return;
  r.notes=document.getElementById('renewal-notes')?.value||'';
  r.medications=r.medications.includes(index)?r.medications.filter(i=>i!==index):[...r.medications,index];
  renderRenewalModal();
}

function submitRenewalRequest() {
  const r=state.renewalRequest;
  if(!r||!r.medications.length||r.medications.some(i=>pendingRenewal(r.patientId,i)))return;
  const medications=r.medications.map(i=>state.patients[r.patientId].medications[i]);
  const notes=(document.getElementById('renewal-notes')?.value||'').trim();
  state.requests.unshift({id:'renewal-'+Date.now(),type:'Medication renewal',patientId:r.patientId,requestedBy:r.requestedBy,medicationIndexes:[...r.medications],title:'Medication renewal: '+medications.map(m=>m.name).join(', '),medicationDetails:medications.map(m=>m.name+' · '+m.dose).join('; '),notes,date:'Just now',status:'pending',response:''});
  state.renewalRequest=null;
  closeModal();
  showToast('Medication renewal request submitted for doctor review.');
}

function approveCarePlan() {
  const id = state.selectedPatientId;
  if (state.approvedPlans.includes(id)) return;

  state.requests.unshift({id:'plan-'+Date.now(), patientId:id, type:'Care Plan', title:'Care plan approved by Dr. Ana Novak', date:'Just now', status:'approved', response:'Your doctor has reviewed and approved your care plan.'});
  showToast('Care plan approved. Patient moved to the bottom of the queue.');

function staffRequestMessages(patientId, role, compact=false) {
  const requests=state.requests.filter(r=>r.patientId===patientId&&r.status==='pending'&&['Medication renewal','Sample request'].includes(r.type));
  return requests.map(r=>{
    const renewal=r.type==='Medication renewal';
    const title=renewal?'Medication renewal requested':`${r.title} requested`;
    if(compact)return `<p class="request-queue-message">${icon(renewal?'pill':'file')} ${e(title)}</p>`;
    const message=renewal?(role==='doctor'?'Review the requested medications for prescription renewal.':'Medication renewal is awaiting doctor review. Check the medication list with the patient.'):(role==='doctor'?'Review this sample request.':'Sample request is awaiting doctor review before collection is arranged.');
    return `<div class="notice"><span>${icon(renewal?'pill':'file')}</span><div><strong>${e(title)}</strong><p>${e(message)}</p>${renewal?`<p>${e(r.medicationDetails)}</p>`:''}${r.notes?`<p>Patient notes: ${e(r.notes)}</p>`:''}</div></div>`;
  }).join('');
}
